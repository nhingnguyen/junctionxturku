services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "4000:4000"
    environment:
      LLM_PROVIDER: ollama
      OLLAMA_URL: https://ollama.com
      OLLAMA_MODEL: gemma4:31b-cloud
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-18}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-30}
      AGENT_DEBUG: ${AGENT_DEBUG:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      TIMEZONE: Europe/Helsinki
      SYKE_USER_ID: ${SYKE_USER_ID:-ryhti}
      MML_API_KEY: ${MML_API_KEY:-}
      MML_BASE_URL: ${MML_BASE_URL:-https://avoin-paikkatieto.maanmittauslaitos.fi/kiinteisto-avoin/simple-features/v3}
      MML_GEOCODING_BASE_URL: ${MML_GEOCODING_BASE_URL:-https://avoin-paikkatieto.maanmittauslaitos.fi/geocoding/v2}
      HELSINKI_DECISIONS_API_URL: ${HELSINKI_DECISIONS_API_URL:-https://paatokset-elastic-proxy.api.hel.ninja/paatokset_decisions/_search}
      PARCEL_DATA_PATH: /app/data/bbox_parcels.json
      ARTICLE_SEARCH_PROVIDER: ${ARTICLE_SEARCH_PROVIDER:-gdelt}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      BRAVE_SEARCH_BASE_URL: ${BRAVE_SEARCH_BASE_URL:-https://api.search.brave.com/res/v1/web/search}
      GDELT_DOC_API_URL: ${GDELT_DOC_API_URL:-https://api.gdeltproject.org/api/v2/doc/doc}
      RISK_DATA_PATH: /app/data/parcels_with_normalized_risks.json
      HSY_WATER_MAPSERVER_URL: ${HSY_WATER_MAPSERVER_URL:-https://arcgis.hsy.fi/arcgis/rest/services/H%C3%A4iri%C3%B6viestint%C3%A4kartta_MIL1/MapServer}
    volumes:
      - ./backend/src:/app/backend/src
      - ./mcp-ryhti/src:/app/mcp-ryhti/src
      - ./mcp-mml/src:/app/mcp-mml/src
      - ./mcp-helsinki-decisions/src:/app/mcp-helsinki-decisions/src
      - ./mcp-articles/src:/app/mcp-articles/src
      - ./mcp-risk/src:/app/mcp-risk/src
      - ./bbox_parcels.json:/app/data/bbox_parcels.json:ro
      - ./parcels_with_normalized_risks.json:/app/data/parcels_with_normalized_risks.json:ro
